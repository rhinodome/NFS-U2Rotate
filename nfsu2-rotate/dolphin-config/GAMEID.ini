# Starting point for Unisoc T618 / Mali-G52. Rename to your game's ID, e.g. ABCD69.ini
[Core]
CPUCore = 4
SyncOnSkipIdle = True
MMU = False
OverclockEnable = True
Overclock = 0.8
DSPHLE = True

[Settings]
ShaderCompilationMode = 0
WaitForShadersBeforeStarting = False

[Video_Settings]
AspectRatio = 2
InternalResolution = 1
MSAA = 0
EnablePixelLighting = False
FastDepthCalc = True
DisableCopyFilter = True
BackendMultithreading = True

[Video_Enhancements]
ForceTextureFiltering = 0
MaxAnisotropy = 0
ForceTrueColor = False

[Video_Hacks]
EFBAccessEnable = False
EFBToTextureEnable = True
XFBToTextureEnable = True
BBoxEnable = False
ImmediateXFBEnable = True
VISkip = False
